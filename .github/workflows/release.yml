              expected_hex = sums.get(fname)
              if expected_hex is None:
                  print("provenance archive filename not in SHA256SUMS: %s" % fname, file=sys.stderr)
                  sys.exit(1)
              if fsha.lower() != expected_hex:
                  print("provenance archive sha256 mismatch for %s" % fname, file=sys.stderr)
                  sys.exit(1)
          print("release provenance semantics verified")
          PY
      - name: Create draft release with assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          sha="$GITHUB_SHA"
          repo="$GITHUB_REPOSITORY"
          ref_out="$RUNNER_TEMP/draft-tag-ref.json"
          tag_out="$RUNNER_TEMP/draft-tag-object.json"
          gh api "repos/$repo/git/ref/tags/$tag" > "$ref_out"
          python3 - "$ref_out" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          obj = data.get("object")
          if not isinstance(obj, dict):
              print("remote tag ref missing object", file=sys.stderr)
              sys.exit(1)
          obj_type = obj.get("type")
          obj_sha = obj.get("sha")
          if obj_type not in ("tag", "commit"):
              print("unsupported tag object type", file=sys.stderr)
              sys.exit(1)
          if not isinstance(obj_sha, str) or not obj_sha:
              print("remote tag ref missing sha", file=sys.stderr)
              sys.exit(1)
          print("remote tag ref resolved")
          PY
          obj_type="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("object", {}).get("type", ""))' "$ref_out")"
          obj_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("object", {}).get("sha", ""))' "$ref_out")"
          test -n "$obj_type"
          test -n "$obj_sha"
          if [ "$obj_type" = "tag" ]; then
            gh api "repos/$repo/git/tags/$obj_sha" > "$tag_out"
            commit_sha="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); o=d.get("object", {}); print(o.get("sha", ""))' "$tag_out")"
          elif [ "$obj_type" = "commit" ]; then
            commit_sha="$obj_sha"
          else
            echo "unsupported tag object type" >&2
            exit 1
          fi
          test -n "$commit_sha"
          if [ "$commit_sha" != "$sha" ]; then
            echo "remote tag moved" >&2
            exit 1
          fi
          echo "remote tag verified at expected commit"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$tag" --notes-file bundle/release-notes.md bundle/astatine-*-macos-arm64.tar.gz bundle/astatine-*-linux-x86_64.tar.gz bundle/SHA256SUMS bundle/release-provenance.json
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"' > "$RUNNER_TEMP/published-assets.txt"
          cat "$RUNNER_TEMP/published-assets.txt"
          python3 - bundle/SHA256SUMS "$RUNNER_TEMP/published-assets.txt" <<'PY'
          import pathlib
          import sys
          checks = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          listed = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          expected = []
          for line in checks.splitlines():
              parts = line.strip().split()
              if len(parts) == 2:
                  expected.append(parts[1])
          for name in expected:
              if name not in listed:
                  print("asset missing from release: %s" % name, file=sys.stderr)
                  sys.exit(1)
          print("all assets attached and listed")
          PY
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/published-assets.json"
          python3 - bundle/SHA256SUMS "$RUNNER_TEMP/published-assets.json" bundle <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          sums_path = pathlib.Path(sys.argv[1])
          remote_path = pathlib.Path(sys.argv[2])
          bundle_dir = pathlib.Path(sys.argv[3])
          sums = {}
          for line in sums_path.read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if not stripped:
                  continue
              parts = stripped.split()
              if len(parts) != 2:
                  print("malformed SHA256SUMS", file=sys.stderr)
                  sys.exit(1)
              hexval, fname = parts
              if "/" in fname or fname in ("", ".", ".."):
                  print("unexpected filename in SHA256SUMS: %s" % fname, file=sys.stderr)
                  sys.exit(1)
              sums[fname] = hexval.lower()
          expected_names = sorted(set(sums) | {"SHA256SUMS", "release-provenance.json"})
          local = {}
          for name in expected_names:
              target = bundle_dir / name
              if not target.is_file():
                  print("missing local bundle file: %s" % name, file=sys.stderr)
                  sys.exit(1)
              data = target.read_bytes()
              local[name] = (hashlib.sha256(data).hexdigest().lower(), len(data))
          for name, hexval in sums.items():
              if local[name][0] != hexval:
                  print("local hash mismatch for %s" % name, file=sys.stderr)
                  sys.exit(1)
          remote_raw = json.loads(remote_path.read_text(encoding="utf-8"))
          assets = remote_raw.get("assets", remote_raw) if isinstance(remote_raw, dict) else remote_raw
          if isinstance(assets, dict) and "assets" in assets:
              assets = assets["assets"]
          remote_by_name = {}
          for entry in assets:
              rname = entry.get("name")
              rsize = entry.get("size")
              rdigest = entry.get("digest")
              if rname is None or rsize is None or rdigest is None:
                  print("remote asset missing fields: %r" % (entry,), file=sys.stderr)
                  sys.exit(1)
              dhex = rdigest
              if isinstance(dhex, str) and dhex.lower().startswith("sha256:"):
                  dhex = dhex.split(":", 1)[1]
              dhex = str(dhex).lower()
              if rname in remote_by_name:
                  print("duplicate remote asset: %s" % rname, file=sys.stderr)
                  sys.exit(1)
              remote_by_name[rname] = (dhex, int(rsize))
          for name in expected_names:
              if name not in remote_by_name:
                  print("asset missing from release: %s" % name, file=sys.stderr)
                  sys.exit(1)
          for name in expected_names:
              exp_hex, exp_size = local[name]
              rem_hex, rem_size = remote_by_name[name]
              if rem_size != exp_size:
                  print("size mismatch for %s: remote %s != local %s" % (name, rem_size, exp_size), file=sys.stderr)
                  sys.exit(1)
              if rem_hex != exp_hex:
                  print("digest mismatch for %s" % name, file=sys.stderr)
                  sys.exit(1)
          if set(remote_by_name) != set(expected_names):
              print("unexpected remote assets: %s" % sorted(set(remote_by_name) - set(expected_names)), file=sys.stderr)
              sys.exit(1)
          print("all assets verified with matching digest and size")
          PY
      - name: Draft verified
        run: |
          set -euo pipefail
          echo "Draft verified; manual owner publication remains required after an admin verifies immutable releases are enabled and all assets/release notes are approved."
