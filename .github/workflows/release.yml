# Release pipeline (manual dispatch only).
#
# Dispatch against the exact tag ref refs/tags/v0.1.0-testnet.3 via
# workflow_dispatch. The release is version-scoped: preflight rejects any other
# tag so an older `.1` candidate cannot run under this owner self-approval
# policy.
#
# Phase1 manual-check contract: this workflow uses only the existing read-only
# GITHUB_TOKEN in automation plus an owner-authorized manual independent live
# ruleset check with the owner credential OUTSIDE this workflow. There is no
# automated bypass verification: the default token cannot see bypass_actors
# (GitHub returns that field only to callers with ruleset-write access), so an
# absent bypass_actors field is expected and is NOT treated as a silent pass.
# Preflight prints BYPASS_ACTORS NOT AUTOMATICALLY VERIFIED and continues on
# structural fields only; it still fails closed on names, scope, enforcement,
# ids, and on any visible bypass mismatch. Authoritative bypass validation is
# an owner manual live check required before dispatch/publish. TOCTOU applies:
# environment approvals can delay mutation after checks, needs does NOT
# inherit SHA binding, and no check is atomic or immediate, so a manual
# prepublish recheck remains required.
#
# Policy: the protected `release` environment (package/draft mutation jobs
# only) uses explicit owner sole self-approval, not independent review, with
# no independent review claimed. The policy pins the owner reviewer by
# immutable numeric GitHub user id 86115037 and login; prevent_self_review
# must be exactly false; can_admins_bypass must be false; and the environment
# deployment policy must be the exact tag v0.1.0-testnet.3, not a wildcard.
# This reduces separation of duties and is documented as a security tradeoff
# in the release notes and inventories: the provenance must record accepted
# residual risk, must record the compromised-owner tradeoff, must be
# owner-attested, and must not claim independent verification. The reviewer id
# must be the immutable owner id 86115037 and the reviewer login must be the
# owner login; the environment name must be exactly release.
# Preflight carries no environment and verifies the live `release`
# environment config via gh api (repos/.../environments/release plus
# deployment-branch-policies?per_page=100) with pagination total_count
# checked; package and draft re-verify release live before mutation. Release
# environment jobs contain zero stored-credential references.
#
# Tag policy is enforced by two composable repository rulesets, each exactly
# `refs/tags/v*` with no exclusions:
# `astatine-release-tag-creation` (exactly the creation rule, exactly
# refs/tags/v* scope, with exactly the owner-user bypass (User 86115037,
# always) for owner-only creation) and `astatine-release-tags` (exactly
# update/deletion/non-fast-forward with zero bypass actors, covering exactly
# refs/tags/v*). Both must be active.
# Narrowing either ruleset to the single .3 tag or the historical .0/.1/.2/.3
# list weakens protection for all other v* tags and fails closed.
# Creation protection is never removed or broadened. Immutable releases must
# still be enabled by the owner; this workflow does not verify that
# repository setting.
# The historical non-self reviewer requirement is superseded for .3 by the
# explicit owner self-approval policy. The exact tag deployment policy remains
# mandatory for the release environment. Tag-ruleset verification is an
# independent external prerequisite enforced structurally by preflight; this
# file does not create or modify the gate. The workflow must fail closed when
# the gate is absent and never weaken it. No stored credential is used beyond
# the default token.
# Candidate binaries are never executed in packaging or attestation; the builder
# only packs and attest jobs only hash and attest the downloaded binary.
# Manual owner publication remains outside this workflow; manual publish is
# required after the draft is verified. The draft is mutable by any repository
# writer; pre-publication asset verification and writer restriction are
# required to address draft asset substitution. Draft releases carry
# prerelease intent; publication is manual-only outside this workflow (no
# publish command lives here).
# Build jobs are read-only candidate execution (no OIDC/attestation write);
# separate attest jobs hold OIDC/attestation write, download the raw binary,
# verify its SHA-256 equals the build output, then attest without executing
# the candidate or running repo scripts. Build binary attestations occur before
# environment approval but are non-release build provenance; archive
# attestations and draft are environment-gated in release-package/release-draft.
# Release-package verifies binary attestations and build-output hashes, so
# archive and draft are bound to compiled binaries;
# archive attestation alone does not prove compilation.
# Provenance records owner-authorized release intent with final controls
# outstanding; it does not authorize final publication.
# Tag-protection ruleset verification is an independent external prerequisite.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag; must be v0.1.0-testnet.3 for this revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: "1.94.1"
  RELEASE_TAG: ${{ inputs.tag }}
  EXPECTED_RELEASE_TAG: "v0.1.0-testnet.3"
  EXPECTED_RELEASE_VERSION: "0.1.0-testnet.3"

jobs:
  preflight:
    name: Preflight tag and exact-commit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$GITHUB_SHA"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - name: Enforce canonical repository and tag ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Jecta-ai/astatine-miner"
          test "$REPOSITORY_ID" = "1454137135"
          test -n "$RELEASE_TAG"
          test "$RELEASE_TAG" = "$EXPECTED_RELEASE_TAG"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
      - name: Verify protected release environment
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Independent verification: preflight carries no environment and checks
          # the live release config itself; same-run needs does NOT inherit SHA/tag
          # binding. Environment approvals can delay later mutations, so this is
          # not atomic or immediate; manual prepublish recheck remains required.
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          env_out="$RUNNER_TEMP/release-env.json"
          policies_out="$RUNNER_TEMP/release-branch-policies.json"
          gh api "repos/$repo/environments/release" > "$env_out"
          gh api "repos/$repo/environments/release/deployment-branch-policies?per_page=100" > "$policies_out"
          python3 -B support/release/verify-protected-environment.py --environment-json "$env_out" --policies-json "$policies_out" --tag "$tag" --expected-environment release
      - name: Verify split tag rulesets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$EXPECTED_RELEASE_TAG"
          rulesets_out="$RUNNER_TEMP/rulesets.json"
          ids_out="$RUNNER_TEMP/tag-ruleset-ids.txt"
          creation_out="$RUNNER_TEMP/tag-creation-ruleset.json"
          immutability_out="$RUNNER_TEMP/tag-immutability-ruleset.json"
          # GitHub returns bypass_actors only to callers with ruleset-write
          # access. The default GITHUB_TOKEN read may omit the field; an absent
          # bypass_actors field is NOT a silent pass and is NOT claimed as
          # verification. Preflight still fails closed on names, scope,
          # enforcement, ids, and on any visible bypass mismatch (creation must
          # be exactly the owner-user bypass; immutability with a visible
          # non-empty bypass fails). Authoritative bypass validation is an owner
          # manual live check required before dispatch/publish. No stored
          # credential is added.
          gh api "repos/$repo/rulesets?includes_parents=true&per_page=100" > "$rulesets_out"
          python3 - "$rulesets_out" "$ids_out" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data, list) or len(data) >= 100:
              print("rulesets response must be a bounded list", file=sys.stderr)
              sys.exit(1)
          expected = {"astatine-release-tag-creation", "astatine-release-tags"}
          active_tag = [
              item for item in data
              if isinstance(item, dict)
              and item.get("target") == "tag"
              and item.get("enforcement") == "active"
          ]
          names = [item.get("name") for item in active_tag]
          if sorted(names) != sorted(expected):
              print("expected exactly the two active split tag rulesets; missing, extra, combined or broadened rulesets fail closed", file=sys.stderr)
              sys.exit(1)
          ids = {item["name"]: item.get("id") for item in active_tag}
          for name, value in ids.items():
              if not isinstance(value, int) or isinstance(value, bool):
                  print("ruleset id must be an integer for " + name, file=sys.stderr)
                  sys.exit(1)
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write("%s\n%s\n" % (ids["astatine-release-tag-creation"], ids["astatine-release-tags"]))
          PY
          { read -r creation_id; read -r immutability_id; } < "$ids_out"
          test -n "$creation_id"
          test -n "$immutability_id"
          gh api "repos/$repo/rulesets/$creation_id" > "$creation_out"
          gh api "repos/$repo/rulesets/$immutability_id" > "$immutability_out"
          # Phase1: an absent bypass_actors field (default-token snapshots omit
          # it without ruleset-write access) is expected and is NOT a silent
          # pass: print the explicit notice and continue on structural fields.
          # A visible bypass must still match exactly. Authoritative bypass
          # validation is an owner manual live check required before
          # dispatch/publish.
          python3 - "$creation_out" "$immutability_out" "$repo" "$tag" <<'PY'
          import json
          import sys
          creation_path, immutability_path, repository, tag = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          if repository != "Jecta-ai/astatine-miner":
              print("split ruleset source must be the canonical repository", file=sys.stderr)
              sys.exit(1)
          if tag != "v0.1.0-testnet.3":
              print("preflight tag must be exactly v0.1.0-testnet.3", file=sys.stderr)
              sys.exit(1)
          creation = json.load(open(creation_path, encoding="utf-8"))
          immutability = json.load(open(immutability_path, encoding="utf-8"))
          allowed_bypasses = [
              {"actor_id": 86115037, "actor_type": "User", "bypass_mode": "always"},
          ]

          def common(data, name, expected_include):
              if not isinstance(data, dict) or data.get("name") != name:
                  print("split ruleset identity mismatch: " + name, file=sys.stderr)
                  sys.exit(1)
              if data.get("target") != "tag" or data.get("source_type") != "Repository" or data.get("source") != repository:
                  print("split ruleset target/source mismatch: " + name, file=sys.stderr)
                  sys.exit(1)
              if data.get("enforcement") != "active":
                  print("split ruleset must be active: " + name, file=sys.stderr)
                  sys.exit(1)
              refs = data.get("conditions", {}).get("ref_name", {})
              if refs.get("include") != expected_include or refs.get("exclude") != []:
                  print("split ruleset scope mismatch: " + name, file=sys.stderr)
                  sys.exit(1)
              rules = data.get("rules")
              if not isinstance(rules, list):
                  print("split ruleset rules must be a list: " + name, file=sys.stderr)
                  sys.exit(1)
              types = [rule.get("type") for rule in rules if isinstance(rule, dict)]
              if len(types) != len(rules) or len(set(types)) != len(types):
                  print("split ruleset rules must be unique objects: " + name, file=sys.stderr)
                  sys.exit(1)
              return set(types)

          creation_rules = common(creation, "astatine-release-tag-creation", ["refs/tags/v*"])
          if creation_rules != {"creation"}:
              print("creation ruleset must retain exactly the creation rule and exactly refs/tags/v* scope; repository-admin bypass is rejected", file=sys.stderr)
              sys.exit(1)
          if "bypass_actors" not in creation:
              print("BYPASS_ACTORS NOT AUTOMATICALLY VERIFIED - owner manual live check required before dispatch/publish (TOCTOU: env approvals can delay mutation, needs does NOT inherit SHA binding, manual prepublish recheck required)")
          else:
              creation_bypass = creation.get("bypass_actors")
              if not isinstance(creation_bypass, list):
                  print("split ruleset bypass_actors must be a list: astatine-release-tag-creation", file=sys.stderr)
                  sys.exit(1)
              if len(creation_bypass) != 1 or creation_bypass[0] not in allowed_bypasses:
                  print("creation ruleset must retain exactly the creation rule and exactly the owner-user bypass (User 86115037, always); repository-admin bypass is rejected", file=sys.stderr)
                  sys.exit(1)
          if creation.get("current_user_can_bypass") not in (None, "always", "exempt", "never"):
              print("creation ruleset designated bypass is not effective", file=sys.stderr)
              sys.exit(1)
          immutability_rules = common(immutability, "astatine-release-tags", ["refs/tags/v*"])
          if immutability_rules != {"update", "deletion", "non_fast_forward"}:
              print("immutability ruleset must use exactly update/deletion/non-fast-forward with zero bypass actors", file=sys.stderr)
              sys.exit(1)
          if "bypass_actors" not in immutability:
              print("BYPASS_ACTORS NOT AUTOMATICALLY VERIFIED - owner manual live check required before dispatch/publish (TOCTOU: env approvals can delay mutation, needs does NOT inherit SHA binding, manual prepublish recheck required)")
          else:
              immutability_bypass = immutability.get("bypass_actors")
              if not isinstance(immutability_bypass, list):
                  print("split ruleset bypass_actors must be a list: astatine-release-tags", file=sys.stderr)
                  sys.exit(1)
              if immutability_bypass != []:
                  print("immutability ruleset must use exactly update/deletion/non-fast-forward with zero bypass actors", file=sys.stderr)
                  sys.exit(1)
          if immutability.get("current_user_can_bypass") in ("always", "exempt"):
              print("immutability ruleset must not allow the current user to bypass", file=sys.stderr)
              sys.exit(1)
          print("split tag rulesets preflight-checked on structural fields; bypass_actors validated when visible, otherwise owner manual live check required")
          PY

      - name: Validate release tag format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in
            *$'\n'*|*$'\r'*|*$'\t'*)
              echo "release tag contains newline or tab" >&2
              exit 1
              ;;
          esac
          if printf '%s' "$tag" | LC_ALL=C grep -q '[^ -~]'; then
            echo "release tag contains non-printable characters" >&2
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-testnet\.[0-9]+$'; then
            echo "release tag does not match required pattern" >&2
            exit 1
          fi
          if [ "$tag" != "$EXPECTED_RELEASE_TAG" ]; then
            echo "release tag must be exactly the current candidate $EXPECTED_RELEASE_TAG" >&2
            exit 1
          fi
      - name: Verify tag matches checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          test "$(git describe --tags --exact-match)" = "$tag"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="$(grep -E '^version *= *"' Cargo.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          test -n "$version"
          test "$version" = "$EXPECTED_RELEASE_VERSION"
          test "$tag" = "v$version"
      - name: Verify no existing release for exact tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          set +e
          release_out="$(gh release view "$tag" --repo "$repo" --json databaseId,isDraft 2>&1)"
          release_rc=$?
          set -e
          if [ "$release_rc" -eq 0 ]; then
            echo "a draft or release already exists for $tag; refusing to attach or replace assets" >&2
            exit 1
          fi
          if ! printf '%s' "$release_out" | grep -qi 'release not found'; then
            echo "cannot establish that no release exists for $tag; refusing to continue" >&2
            exit 1
          fi
          echo "no existing release for the exact tag"

      - name: Verify fixture provenance
        run: |
          set -euo pipefail
          python3 -B support/verify-fixture-provenance.py > "$RUNNER_TEMP/fixture-provenance.json"
          python3 - "$RUNNER_TEMP/fixture-provenance.json" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("schema") != "astatine-fixture-provenance/v3":
              print("fixture provenance schema must be astatine-fixture-provenance/v3 (blocked v1 rejected)", file=sys.stderr)
              sys.exit(1)
          if data.get("release_intent_authorized") is not True:
              print("fixture provenance release_intent_authorized must be exactly true", file=sys.stderr)
              sys.exit(1)
          if data.get("publication_authorized") is not False:
              print("fixture provenance publication_authorized must be exactly false", file=sys.stderr)
              sys.exit(1)
          if data.get("final_release_controls_complete") is not False:
              print("fixture provenance final_release_controls_complete must be exactly false", file=sys.stderr)
              sys.exit(1)
          print("fixture provenance release intent authorized; final publication not authorized")
          PY
      - name: Verify distribution inventory
        run: |
          set -euo pipefail
          python3 -B support/verify-distribution-inventory.py > "$RUNNER_TEMP/distribution-inventory.json"
          python3 - "$RUNNER_TEMP/distribution-inventory.json" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("schema") != "astatine-distribution-inventory/v3":
              print("distribution inventory schema must be astatine-distribution-inventory/v3 (blocked v1 rejected)", file=sys.stderr)
              sys.exit(1)
          if data.get("release_intent_authorized") is not True:
              print("distribution inventory release_intent_authorized must be exactly true", file=sys.stderr)
              sys.exit(1)
          if data.get("publication_authorized") is not False:
              print("distribution inventory publication_authorized must be exactly false", file=sys.stderr)
              sys.exit(1)
          if data.get("final_release_controls_complete") is not False:
              print("distribution inventory final_release_controls_complete must be exactly false", file=sys.stderr)
              sys.exit(1)
          print("distribution inventory release intent authorized; final publication not authorized")
          PY
      - name: Verify exact-commit hosted checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          repo="$GITHUB_REPOSITORY"
          out="$RUNNER_TEMP/exact-runs.json"
          gh api "repos/$repo/actions/runs?head_sha=$sha&per_page=100" > "$out"
          python3 - "$out" "$sha" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          expected = sys.argv[2]
          data = json.load(open(path, encoding="utf-8"))
          runs = data.get("workflow_runs", [])
          total_count = data.get("total_count")
          if not isinstance(total_count, int) or isinstance(total_count, bool):
              print("exact-commit run total_count must be an integer", file=sys.stderr)
              sys.exit(1)
          if total_count != len(runs):
              print("exact-commit run total_count does not match the returned page; refusing partial pagination", file=sys.stderr)
              sys.exit(1)
          if total_count > 100:
              print("exact-commit run list exceeds the bounded per-page request", file=sys.stderr)
              sys.exit(1)
          required = {
              "Rust CI": ".github/workflows/ci.yml",
              "Linux native qualification": ".github/workflows/linux-native-qualification.yml",
          }
          for name, expected_path in required.items():
              candidates = [
                  r for r in runs
                  if r.get("name") == name
                  and r.get("path") == expected_path
                  and r.get("head_sha") == expected
                  and r.get("event") == "push"
                  and r.get("head_branch") == "main"
              ]
              if len(candidates) == 0:
                  print("missing push run for %r at %s with path %r on main" % (name, expected, expected_path), file=sys.stderr)
                  sys.exit(1)
              def run_key(r):
                  return (r.get("run_started_at") or r.get("created_at") or "", r.get("id") or 0)
              latest = max(candidates, key=run_key)
              head_repository = latest.get("head_repository")
              if not isinstance(head_repository, dict) or head_repository.get("id") != 1454137135:
                  print("exact-commit run for %r is not from the canonical repository id 1454137135" % name, file=sys.stderr)
                  sys.exit(1)
              repository = latest.get("repository")
              if not isinstance(repository, dict) or repository.get("id") != 1454137135:
                  print("exact-commit run for %r does not belong to the canonical repository id 1454137135" % name, file=sys.stderr)
                  sys.exit(1)
              if latest.get("event") in ("pull_request", "pull_request_target", "workflow_dispatch"):
                  print("pull request or dispatch event not accepted for %r" % name, file=sys.stderr)
                  sys.exit(1)
              if latest.get("event") != "push" or latest.get("head_branch") != "main":
                  print("release gate needs the exact main push run for %r (workflow_dispatch is not a substitute)" % name, file=sys.stderr)
                  sys.exit(1)
              if latest.get("status") != "completed" or latest.get("conclusion") != "success":
                  print("latest push run for %r is not successful: id=%s name=%s path=%s status=%s conclusion=%s event=%s head_branch=%s url=%s" % (name, latest.get("id"), latest.get("name"), latest.get("path"), latest.get("status"), latest.get("conclusion"), latest.get("event"), latest.get("head_branch"), latest.get("html_url")), file=sys.stderr)
                  sys.exit(1)
              if latest.get("head_sha") != expected:
                  print("exact head SHA mismatch for %r" % name, file=sys.stderr)
                  sys.exit(1)
          print("exact-commit checks verified")
          PY

  build-macos:
    name: Build macOS arm64 binary
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      binary_sha256: ${{ steps.record-hash.outputs.binary_sha256 }}
      rustc_version: ${{ steps.observe-toolchain.outputs.rustc_version }}
      cargo_version: ${{ steps.observe-toolchain.outputs.cargo_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$GITHUB_SHA"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          test "$(rustc --version | awk '{print $2}')" = "1.94.1"
      - name: Observe pinned toolchain versions
        id: observe-toolchain
        run: |
          set -euo pipefail
          rustc_line="$(rustc --version)"
          cargo_line="$(cargo --version)"
          test "$rustc_line" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$cargo_line" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          printf 'rustc_version=%s\n' "$rustc_line" >> "$GITHUB_OUTPUT"
          printf 'cargo_version=%s\n' "$cargo_line" >> "$GITHUB_OUTPUT"
      - name: Build locked release binary
        run: cargo build --locked --release
      - name: Smoke test release binary
        run: |
          set -euo pipefail
          ./target/release/astatine --version
          ./target/release/astatine --help >/dev/null
          ./target/release/astatine mine --help >/dev/null
      - name: Inspect macOS binary
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=4 ./target/release/astatine
          file ./target/release/astatine
          otool -L ./target/release/astatine
      - name: Record binary SHA-256
        id: record-hash
        run: |
          set -euo pipefail
          sha="$(shasum -a 256 target/release/astatine | cut -d' ' -f1)"
          test -n "$sha"
          printf 'binary_sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "binary sha256 recorded"
      - name: Upload macOS binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astatine-macos-arm64
          path: target/release/astatine
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux x86_64 binary
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      binary_sha256: ${{ steps.record-hash.outputs.binary_sha256 }}
      rustc_version: ${{ steps.observe-toolchain.outputs.rustc_version }}
      cargo_version: ${{ steps.observe-toolchain.outputs.cargo_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$GITHUB_SHA"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          test "$(rustc --version | awk '{print $2}')" = "1.94.1"
          test "$(rustc -vV | awk '$1 == "host:" {print $2}')" = "x86_64-unknown-linux-gnu"
      - name: Observe pinned toolchain versions
        id: observe-toolchain
        run: |
          set -euo pipefail
          rustc_line="$(rustc --version)"
          cargo_line="$(cargo --version)"
          test "$rustc_line" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$cargo_line" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          printf 'rustc_version=%s\n' "$rustc_line" >> "$GITHUB_OUTPUT"
          printf 'cargo_version=%s\n' "$cargo_line" >> "$GITHUB_OUTPUT"
      - name: Build locked release binary
        run: cargo build --locked --release
      - name: Smoke test release binary
        run: |
          set -euo pipefail
          ./target/release/astatine --version
          ./target/release/astatine --help >/dev/null
          ./target/release/astatine mine --help >/dev/null
      - name: Inspect Linux binary
        run: |
          set -euo pipefail
          file ./target/release/astatine
          ldd ./target/release/astatine
      - name: Record binary SHA-256
        id: record-hash
        run: |
          set -euo pipefail
          sha="$(sha256sum target/release/astatine | cut -d' ' -f1)"
          test -n "$sha"
          printf 'binary_sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "binary sha256 recorded"
      - name: Upload Linux binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astatine-linux-x86_64
          path: target/release/astatine
          if-no-files-found: error
          retention-days: 7

  attest-macos:
    name: Attest macOS binary provenance
    needs: build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download macOS binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: astatine-macos-arm64
          path: ${{ runner.temp }}/attest/macos
      - name: Verify macOS binary hash matches build output
        env:
          EXPECTED_SHA256: ${{ needs.build-macos.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256"
          binary="$RUNNER_TEMP/attest/macos/astatine"
          test -f "$binary"
          actual="$(sha256sum "$binary" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "macOS binary hash mismatch against build output" >&2
            exit 1
          fi
          echo "macOS binary hash verified against build output"
      # Build-provenance attestation for the raw compiled binary (pre-approval;
      # not a release archive asset). Release archives are attested only after
      # environment approval in release-draft.
      - name: Attest raw macOS binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/macos/astatine

  attest-linux:
    name: Attest Linux binary provenance
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: astatine-linux-x86_64
          path: ${{ runner.temp }}/attest/linux
      - name: Verify Linux binary hash matches build output
        env:
          EXPECTED_SHA256: ${{ needs.build-linux.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256"
          binary="$RUNNER_TEMP/attest/linux/astatine"
          test -f "$binary"
          actual="$(sha256sum "$binary" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "Linux binary hash mismatch against build output" >&2
            exit 1
          fi
          echo "Linux binary hash verified against build output"
      # Build-provenance attestation for the raw compiled binary (pre-approval;
      # not a release archive asset). Release archives are attested only after
      # environment approval in release-draft.
      - name: Attest raw Linux binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/linux/astatine

  release-package:
    name: Package and attest release bundle
    needs:
      - build-macos
      - build-linux
      - attest-macos
      - attest-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$GITHUB_SHA"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - name: Download macOS binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: astatine-macos-arm64
          path: ${{ runner.temp }}/retrieved/macos
      - name: Download Linux binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: astatine-linux-x86_64
          path: ${{ runner.temp }}/retrieved/linux
      - name: Verify binaries match build outputs
        env:
          EXPECTED_MACOS_SHA256: ${{ needs.build-macos.outputs.binary_sha256 }}
          EXPECTED_LINUX_SHA256: ${{ needs.build-linux.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_MACOS_SHA256"
          test -n "$EXPECTED_LINUX_SHA256"
          macos_binary="$RUNNER_TEMP/retrieved/macos/astatine"
          linux_binary="$RUNNER_TEMP/retrieved/linux/astatine"
          test -f "$macos_binary"
          test -f "$linux_binary"
          actual_macos="$(sha256sum "$macos_binary" | cut -d' ' -f1)"
          actual_linux="$(sha256sum "$linux_binary" | cut -d' ' -f1)"
          if [ "$actual_macos" != "$EXPECTED_MACOS_SHA256" ]; then
            echo "macOS binary hash mismatch against build output" >&2
            exit 1
          fi
          if [ "$actual_linux" != "$EXPECTED_LINUX_SHA256" ]; then
            echo "Linux binary hash mismatch against build output" >&2
            exit 1
          fi
          echo "binaries verified against build outputs"
      - name: Re-verify protected environment before mutation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Independent verification: same-run needs does NOT inherit SHA/tag
          # binding; this job re-verifies its own release gate live before
          # mutation. Environment approval can delay mutation after this check,
          # so this is not atomic or immediate; manual prepublish recheck
          # remains required.
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          env_out="$RUNNER_TEMP/package-env.json"
          policies_out="$RUNNER_TEMP/package-branch-policies.json"
          gh api "repos/$repo/environments/release" > "$env_out"
          gh api "repos/$repo/environments/release/deployment-branch-policies?per_page=100" > "$policies_out"
          python3 -B support/release/verify-protected-environment.py --environment-json "$env_out" --policies-json "$policies_out" --tag "$tag" --expected-environment release
      # Phase1: no automated bypass verification is possible here.
      # The default token cannot see bypass_actors (no ruleset-write access),
      # so no default-token split-ruleset detail check is attempted here; an
      # absent field is NOT a silent pass. Authoritative bypass validation is
      # an owner manual live check required before dispatch/publish.
      # Needs ordering is not atomic or immediate and does not inherit SHA
      # binding; this job still verifies GITHUB_SHA, tag, and digests itself,
      # and manual prepublish recheck remains required.
      - name: Verify binary build attestations before packaging
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          for binary in "$RUNNER_TEMP/retrieved/macos/astatine" "$RUNNER_TEMP/retrieved/linux/astatine"; do
            test -f "$binary"
            gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "refs/tags/$tag"
          done
      - name: Build release bundle without executing binaries
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUSTC_VERSION: ${{ needs.build-macos.outputs.rustc_version }}
          CARGO_VERSION: ${{ needs.build-macos.outputs.cargo_version }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo_id="$REPOSITORY_ID"
          test -n "$RUSTC_VERSION"
          test -n "$CARGO_VERSION"
          test "$RUSTC_VERSION" = "rustc 1.94.1 (e408947bf 2026-03-25)"
          test "$CARGO_VERSION" = "cargo 1.94.1 (29ea6fb6a 2026-03-24)"
          out="$RUNNER_TEMP/bundle-out"
          rm -rf "$out"
          mkdir -p "$out"
          python3 -B support/release/build-release.py --tag "$tag" --repository-id "$repo_id" --macos-binary "$RUNNER_TEMP/retrieved/macos/astatine" --linux-binary "$RUNNER_TEMP/retrieved/linux/astatine" --output-dir "$out" --rustc-version "$RUSTC_VERSION" --cargo-version "$CARGO_VERSION"
          test -f "$out/astatine-$tag-macos-arm64.tar.gz"
          test -f "$out/astatine-$tag-linux-x86_64.tar.gz"
          test -f "$out/SHA256SUMS"
          test -f "$out/release-provenance.json"
          tagged_notes="$RUNNER_TEMP/tagged-release-notes.md"
          git show "refs/tags/$tag:support/release/RELEASE_NOTES-v0.1.0-testnet.3.md" > "$tagged_notes"
          cmp support/release/RELEASE_NOTES-v0.1.0-testnet.3.md "$tagged_notes"
          cp "$tagged_notes" "$out/release-notes.md"
          test -f "$out/release-notes.md"
          if ls "$out" | grep -Ei 'fixture|provenance\.json'; then
            if ! ls "$out" | grep -Eq '^release-provenance\.json$'; then
              echo "unexpected provenance file" >&2
              exit 1
            fi
            extra="$(ls "$out" | grep -Ei 'fixture' || true)"
            test -z "$extra"
          fi
          for archive in "$out"/astatine-*.tar.gz; do
            if tar -tzf "$archive" | grep -Ei 'fixture|PROVENANCE'; then
              echo "forbidden member present" >&2
              exit 1
            fi
          done
          (cd "$out" && sha256sum -c SHA256SUMS)
      - name: Verify remote tag and provenance before archive attestation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          sha="$GITHUB_SHA"
          repo_id="$REPOSITORY_ID"
          out="$RUNNER_TEMP/bundle-out"
          remote_info="$(git ls-remote origin "refs/tags/$tag")"
          test -n "$remote_info"
          python3 - "$remote_info" "$tag" "$sha" <<'PY'
          import sys
          info, tag, expected = sys.argv[1], sys.argv[2], sys.argv[3]
          wanted = "refs/tags/" + tag
          peeled_ref = wanted + "^{}"
          peeled = None
          direct = None
          lines = [line for line in info.splitlines() if line.strip()]
          if not lines:
              print("remote tag missing", file=sys.stderr)
              sys.exit(1)
          for line in lines:
              parts = line.strip().split()
              if len(parts) != 2:
                  print("ambiguous ls-remote output", file=sys.stderr)
                  sys.exit(1)
              obj, ref = parts
              if ref == peeled_ref:
                  if peeled is not None:
                      print("multiple peeled refs", file=sys.stderr)
                      sys.exit(1)
                  peeled = obj
              elif ref == wanted:
                  if direct is not None:
                      print("multiple tag refs", file=sys.stderr)
                      sys.exit(1)
                  direct = obj
              else:
                  print("unexpected ref in ls-remote: %s" % ref, file=sys.stderr)
                  sys.exit(1)
          commit = peeled if peeled is not None else direct
          if commit is None:
              print("remote tag ref missing", file=sys.stderr)
              sys.exit(1)
          if commit != expected:
              print("remote tag moved: expected %s got %s" % (expected, commit), file=sys.stderr)
              sys.exit(1)
          print("remote tag verified at expected commit")
          PY
          python3 - "$out/release-provenance.json" "$out/SHA256SUMS" "$tag" "$sha" "$repo_id" <<'PY'
          import json
          import pathlib
          import sys
          prov_path = pathlib.Path(sys.argv[1])
          sums_path = pathlib.Path(sys.argv[2])
          exp_tag, exp_sha, exp_repo_id = sys.argv[3], sys.argv[4], sys.argv[5]
          prov = json.loads(prov_path.read_text(encoding="utf-8"))
          if prov.get("tag") != exp_tag:
              print("provenance field tag mismatch", file=sys.stderr)
              sys.exit(1)
          release_meta = prov.get("release")
          if not isinstance(release_meta, dict):
              print("provenance field release identity missing", file=sys.stderr)
              sys.exit(1)
          if release_meta.get("tag") != exp_tag or release_meta.get("exact_tag_required") is not True:
              print("provenance field release identity mismatch", file=sys.stderr)
              sys.exit(1)
          if release_meta.get("tag_policy") != "refs/tags/" + exp_tag:
              print("provenance field exact tag policy mismatch", file=sys.stderr)
              sys.exit(1)
          owner_policy = prov.get("owner_self_approval")
          if not isinstance(owner_policy, dict):
              print("provenance field owner_self_approval missing", file=sys.stderr)
              sys.exit(1)
          if owner_policy.get("independent_reviewer") is not False:
              print("provenance field owner self-approval must not claim an independent reviewer", file=sys.stderr)
              sys.exit(1)
          if owner_policy.get("owner_attested") is not True:
              print("provenance field owner self-approval must be owner-attested", file=sys.stderr)
              sys.exit(1)
          if owner_policy.get("independent_verification") is not False:
              print("provenance field owner self-approval must not claim independent verification", file=sys.stderr)
              sys.exit(1)
          if owner_policy.get("separation_of_duties") is None or not str(owner_policy.get("separation_of_duties")).startswith("NONE"):
              print("provenance field owner self-approval must record no separation of duties", file=sys.stderr)
              sys.exit(1)
          if owner_policy.get("residual_risk_accepted") is not True:
              print("provenance field owner self-approval must record accepted residual risk", file=sys.stderr)
              sys.exit(1)
          if "compromised" not in str(owner_policy.get("security_tradeoff", "")).lower():
              print("provenance field owner self-approval must record the compromised-owner tradeoff", file=sys.stderr)
              sys.exit(1)
          historical = prov.get("historical_release_intent")
          if not isinstance(historical, dict) or historical.get("tag") != "v0.1.0-testnet.1":
              print("provenance field historical .1 intent missing", file=sys.stderr)
              sys.exit(1)
          if prov.get("commit") != exp_sha:
              print("provenance field commit mismatch", file=sys.stderr)
              sys.exit(1)
          if prov.get("repository") != "Jecta-ai/astatine-miner":
              print("provenance field repository mismatch", file=sys.stderr)
              sys.exit(1)
          if str(prov.get("repository_id")) != str(exp_repo_id):
              print("provenance field repository_id mismatch", file=sys.stderr)
              sys.exit(1)
          if prov.get("release_intent_authorized") is not True:
              print("provenance field release_intent_authorized must be exactly true", file=sys.stderr)
              sys.exit(1)
          if prov.get("publication_authorized") is not False:
              print("provenance field publication_authorized must be exactly false", file=sys.stderr)
              sys.exit(1)
          if prov.get("final_release_controls_complete") is not False:
              print("provenance field final_release_controls_complete must be exactly false", file=sys.stderr)
              sys.exit(1)
          decision = prov.get("rights_decision")
          if not isinstance(decision, str) or not decision.strip():
              print("provenance field rights_decision missing or empty", file=sys.stderr)
              sys.exit(1)
          decision_lower = decision.lower()
          if "owner-authorized release intent" not in decision_lower:
              print("provenance field rights_decision must record owner-authorized release intent", file=sys.stderr)
              sys.exit(1)
          if "final release controls outstanding" not in decision_lower:
              print("provenance field rights_decision must record final controls outstanding", file=sys.stderr)
              sys.exit(1)
          if "publication authorized" in decision_lower or "release approver" in decision_lower:
              print("provenance field rights_decision must not claim publication authorization or a release approver", file=sys.stderr)
              sys.exit(1)
          if prov.get("targets") != ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]:
              print("provenance field targets mismatch", file=sys.stderr)
              sys.exit(1)
          sums = {}
          for line in sums_path.read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if not stripped:
                  continue
              parts = stripped.split()
              if len(parts) != 2:
                  print("malformed SHA256SUMS", file=sys.stderr)
                  sys.exit(1)
              sums[parts[1]] = parts[0].lower()
          archives = prov.get("archives")
          if not isinstance(archives, list) or len(archives) == 0:
              print("provenance field archives must be a non-empty list", file=sys.stderr)
              sys.exit(1)
          for entry in archives:
              if not isinstance(entry, dict):
                  print("provenance field archives entry must be an object", file=sys.stderr)
                  sys.exit(1)
              fname = entry.get("filename")
              fsha = entry.get("sha256")
              if not isinstance(fname, str) or not isinstance(fsha, str):
                  print("provenance field archives filename/sha256 missing", file=sys.stderr)
                  sys.exit(1)
              expected_hex = sums.get(fname)
              if expected_hex is None:
                  print("provenance archive filename not in SHA256SUMS: %s" % fname, file=sys.stderr)
                  sys.exit(1)
              if fsha.lower() != expected_hex:
                  print("provenance archive sha256 mismatch for %s" % fname, file=sys.stderr)
                  sys.exit(1)
          print("release provenance semantics verified")
          PY
      - name: Attest macOS archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/bundle-out/astatine-*-macos-arm64.tar.gz
      - name: Attest Linux archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/bundle-out/astatine-*-linux-x86_64.tar.gz
      - name: Verify archive attestations
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          for archive in "$RUNNER_TEMP"/bundle-out/astatine-*-macos-arm64.tar.gz "$RUNNER_TEMP"/bundle-out/astatine-*-linux-x86_64.tar.gz; do
            test -f "$archive"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "refs/tags/$tag"
          done
      - name: Upload bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astatine-release-bundle
          path: ${{ runner.temp }}/bundle-out/
          if-no-files-found: error
          retention-days: 7

  release-draft:
    name: Create and verify draft release
    needs: release-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: astatine-release-bundle
          path: bundle
      - name: Re-verify protected environment before mutation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          env_out="$RUNNER_TEMP/draft-env.json"
          policies_out="$RUNNER_TEMP/draft-branch-policies.json"
          gh api "repos/$repo/environments/release" > "$env_out"
          gh api "repos/$repo/environments/release/deployment-branch-policies?per_page=100" > "$policies_out"
          python3 - "$env_out" "$policies_out" "$tag" <<'PY'
          import json
          import sys
          env_path, policies_path, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          if tag != "v0.1.0-testnet.3":
              print("draft tag must be exactly v0.1.0-testnet.3", file=sys.stderr)
              sys.exit(1)
          env_data = json.load(open(env_path, encoding="utf-8"))
          if env_data.get("name") != "release":
              print("protection field environment name must be exactly release", file=sys.stderr)
              sys.exit(1)
          if env_data.get("can_admins_bypass") is not False:
              print("protection field can_admins_bypass must be exactly false", file=sys.stderr)
              sys.exit(1)
          top_self_review = env_data.get("prevent_self_review")
          if top_self_review is not None and top_self_review is not False:
              print("protection field prevent_self_review must be false for owner self-approval", file=sys.stderr)
              sys.exit(1)
          rules = env_data.get("protection_rules")
          if not isinstance(rules, list):
              print("protection field protection_rules must be a list", file=sys.stderr)
              sys.exit(1)
          reviewer_rules = [r for r in rules if isinstance(r, dict) and r.get("type") == "required_reviewers"]
          if len(reviewer_rules) != 1:
              print("protection field required_reviewers count must be exactly one", file=sys.stderr)
              sys.exit(1)
          rule = reviewer_rules[0]
          if rule.get("prevent_self_review") is not False:
              print("protection field required_reviewers prevent_self_review must be exactly false", file=sys.stderr)
              sys.exit(1)
          reviewers = rule.get("reviewers")
          if not isinstance(reviewers, list) or len(reviewers) != 1:
              print("protection field reviewers must contain exactly the owner reviewer", file=sys.stderr)
              sys.exit(1)
          reviewer = reviewers[0]
          if not isinstance(reviewer, dict) or reviewer.get("type") != "User":
              print("protection field reviewer must be a User object", file=sys.stderr)
              sys.exit(1)
          nested = reviewer.get("reviewer")
          if not isinstance(nested, dict):
              print("protection field reviewer.reviewer must be an object", file=sys.stderr)
              sys.exit(1)
          if nested.get("id") != 86115037 or isinstance(nested.get("id"), bool):
              print("protection field reviewer id must be the immutable owner id 86115037", file=sys.stderr)
              sys.exit(1)
          if nested.get("login") != "emyrinj":
              print("protection field reviewer login must be the owner login", file=sys.stderr)
              sys.exit(1)
          branch_policy = env_data.get("deployment_branch_policy")
          if not isinstance(branch_policy, dict):
              print("protection field deployment_branch_policy must be an object", file=sys.stderr)
              sys.exit(1)
          if branch_policy.get("custom_branch_policies") is not True:
              print("protection field custom_branch_policies must be exactly true", file=sys.stderr)
              sys.exit(1)
          if branch_policy.get("protected_branches") is not False:
              print("protection field protected_branches must be exactly false", file=sys.stderr)
              sys.exit(1)
          print("owner self-approval environment re-verified before mutation")
          policies_data = json.load(open(policies_path, encoding="utf-8"))
          if not isinstance(policies_data, dict):
              print("protection field policies JSON must be an object", file=sys.stderr)
              sys.exit(1)
          total_count = policies_data.get("total_count")
          if not isinstance(total_count, int) or isinstance(total_count, bool):
              print("protection field policies total_count must be an integer", file=sys.stderr)
              sys.exit(1)
          present_keys = [key for key in ("branch_policies", "policies", "deployment_branch_policies") if key in policies_data]
          if len(present_keys) != 1:
              print("protection field policies JSON must contain exactly one policy array field", file=sys.stderr)
              sys.exit(1)
          if set(policies_data) != {"total_count", present_keys[0]}:
              print("protection field policies JSON contains unexpected fields", file=sys.stderr)
              sys.exit(1)
          policies = policies_data[present_keys[0]]
          if not isinstance(policies, list):
              print("protection field branch_policies must be a list", file=sys.stderr)
              sys.exit(1)
          if total_count != len(policies):
              print("protection field policies total_count does not match the returned list; refusing partial pagination", file=sys.stderr)
              sys.exit(1)
          if total_count != 1:
              print("protection field tag policies must be exactly one", file=sys.stderr)
              sys.exit(1)
          entry = policies[0]
          if not isinstance(entry, dict):
              print("protection field tag policy entry must be an object", file=sys.stderr)
              sys.exit(1)
          if entry.get("type") != "tag":
              if entry.get("type") == "branch":
                  print("protection field branch policies must be empty when tag policies are used", file=sys.stderr)
              else:
                  print("protection field tag policy type must be exactly tag", file=sys.stderr)
              sys.exit(1)
          name = entry.get("name", entry.get("pattern", ""))
          if not isinstance(name, str) or not name:
              print("protection field tag policy name missing", file=sys.stderr)
              sys.exit(1)
          if any(character in name for character in ("*", "?", "[", "]")):
              print("tag policy must be the exact tag, not a wildcard", file=sys.stderr)
              sys.exit(1)
          if name != tag:
              print("tag policy name must be exactly the release tag", file=sys.stderr)
              sys.exit(1)
          print("exact tag deployment policy re-verified before mutation")
          PY
      - name: Verify bundle checksums
        run: |
          set -euo pipefail
          (cd bundle && sha256sum -c SHA256SUMS)
      - name: Verify packaged binaries match attested compiled binaries
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          extract_dir="$RUNNER_TEMP/attested-binaries"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          python3 - bundle "$extract_dir" "$GITHUB_SHA" "$tag" <<'PY'
          import hashlib
          import io
          import json
          import pathlib
          import sys
          import tarfile

          bundle_dir = pathlib.Path(sys.argv[1])
          extract_dir = pathlib.Path(sys.argv[2])
          expected_commit = sys.argv[3]
          expected_tag = sys.argv[4]

          expected = {
              "astatine-v0.1.0-testnet.3-macos-arm64.tar.gz": (
                  "astatine-v0.1.0-testnet.3-macos-arm64",
                  "aarch64-apple-darwin",
              ),
              "astatine-v0.1.0-testnet.3-linux-x86_64.tar.gz": (
                  "astatine-v0.1.0-testnet.3-linux-x86_64",
                  "x86_64-unknown-linux-gnu",
              ),
          }
          basenames = {
              "astatine": 0o755,
              "BUILD-INFO.json": 0o644,
              "INSTALL.md": 0o644,
              "LICENSE-MIT": 0o644,
              "THIRD_PARTY_LICENSES.md": 0o644,
          }

          def fail(message):
              print(message, file=sys.stderr)
              sys.exit(1)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          prov = json.loads((bundle_dir / "release-provenance.json").read_text(encoding="utf-8"))
          if prov.get("commit") != expected_commit:
              fail("provenance commit does not match GITHUB_SHA")
          if prov.get("tag") != expected_tag:
              fail("provenance tag does not match RELEASE_TAG")
          entries = prov.get("archives")
          if not isinstance(entries, list) or len(entries) != len(expected):
              fail("provenance must contain exactly two archives")
          by_name = {}
          for entry in entries:
              if not isinstance(entry, dict):
                  fail("provenance archive entry must be an object")
              name = entry.get("filename")
              if not isinstance(name, str) or name in by_name:
                  fail("provenance archive filename missing or duplicated")
              by_name[name] = entry
          if set(by_name) != set(expected):
              fail("provenance archive allowlist mismatch")

          sums = {}
          for line in (bundle_dir / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if not stripped:
                  continue
              parts = stripped.split()
              if len(parts) != 2:
                  fail("malformed SHA256SUMS")
              sums[parts[1]] = parts[0].lower()
          if set(sums) != set(expected):
              fail("SHA256SUMS archive allowlist mismatch")

          manifest = {"commit": expected_commit, "tag": expected_tag}
          manifest["binaries"] = {}
          for filename, (root, target) in expected.items():
              entry = by_name[filename]
              if entry.get("target") != target:
                  fail("provenance target mismatch for " + filename)
              if entry.get("sha256", "").lower() != sums[filename]:
                  fail("provenance archive sha256 does not match SHA256SUMS for " + filename)
              archive_path = bundle_dir / filename
              archive_bytes = archive_path.read_bytes()
              if sha256(archive_bytes) != sums[filename]:
                  fail("archive sha256 does not match SHA256SUMS for " + filename)

              expected_paths = {f"{root}/{basename}" for basename in basenames}
              members = {}
              with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:gz") as tar:
                  for member in tar.getmembers():
                      name = member.name
                      if name in members:
                          fail("duplicate archive member: " + name)
                      if member.type != tarfile.REGTYPE or not member.isreg():
                          fail("archive member must be a regular file: " + name)
                      pure = pathlib.PurePosixPath(name)
                      if pure.is_absolute() or ".." in pure.parts or len(pure.parts) != 2:
                          fail("archive member path is unsafe: " + name)
                      if name not in expected_paths:
                          fail("archive member is outside the allowlist: " + name)
                      if member.mode != basenames[pure.name]:
                          fail("archive member mode mismatch: " + name)
                      data = tar.extractfile(member)
                      if data is None:
                          fail("archive member is not readable: " + name)
                      members[name] = data.read()
              if set(members) != expected_paths:
                  fail("archive member set mismatch for " + filename)

              provenance_members = entry.get("members")
              if not isinstance(provenance_members, list) or len(provenance_members) != len(basenames):
                  fail("provenance member allowlist mismatch for " + filename)
              provenance_by_path = {}
              for member_entry in provenance_members:
                  if not isinstance(member_entry, dict):
                      fail("provenance member entry must be an object")
                  member_path = member_entry.get("archive_path")
                  if not isinstance(member_path, str) or member_path in provenance_by_path:
                      fail("provenance member path missing or duplicated")
                  provenance_by_path[member_path] = member_entry
              if set(provenance_by_path) != expected_paths:
                  fail("provenance member set does not match archive allowlist for " + filename)
              for name, data in members.items():
                  member_entry = provenance_by_path[name]
                  if member_entry.get("sha256", "").lower() != sha256(data):
                      fail("archive member sha256 does not match provenance: " + name)
                  if member_entry.get("bytes") != len(data):
                      fail("archive member size does not match provenance: " + name)
                  if member_entry.get("mode") != oct(basenames[pathlib.PurePosixPath(name).name]):
                      fail("archive member mode does not match provenance: " + name)

              binary_name = f"{root}/astatine"
              binary = members[binary_name]
              binary_hash = sha256(binary)
              if entry.get("binary_sha256", "").lower() != binary_hash:
                  fail("packaged binary sha256 does not match provenance for " + target)
              if entry.get("binary_bytes") != len(binary):
                  fail("packaged binary size does not match provenance for " + target)
              if target == "aarch64-apple-darwin":
                  if len(binary) < 32 or binary[0:4] != b"\xcf\xfa\xed\xfe":
                      fail("macOS binary format mismatch: not a 64-bit Mach-O object")
                  if int.from_bytes(binary[4:8], "little") != 0x0100000C:
                      fail("macOS binary format mismatch: not an ARM64 Mach-O object")
                  if int.from_bytes(binary[12:16], "little") != 2:
                      fail("macOS binary format mismatch: not an executable Mach-O object")
              elif target == "x86_64-unknown-linux-gnu":
                  if len(binary) < 64 or binary[0:4] != b"\x7fELF":
                      fail("Linux binary format mismatch: not an ELF executable")
                  if binary[4] != 2 or binary[5] != 1:
                      fail("Linux binary format mismatch: not 64-bit little-endian ELF")
                  if int.from_bytes(binary[18:20], "little") != 62:
                      fail("Linux binary format mismatch: not x86-64 ELF")
              else:
                  fail("unsupported attested binary target")
              destination = extract_dir / target / "astatine"
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(binary)
              destination.chmod(0o700)
              manifest["binaries"][target] = {
                  "sha256": binary_hash,
                  "archive": filename,
                  "archive_sha256": sums[filename],
              }

          if set(manifest["binaries"]) != {"aarch64-apple-darwin", "x86_64-unknown-linux-gnu"}:
              fail("attested binary target set mismatch")
          (extract_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("packaged binaries match archive and provenance allowlists; binaries extracted")
          PY
      - name: Verify extracted binaries against build attestations
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          manifest="$RUNNER_TEMP/attested-binaries/manifest.json"
          test -f "$manifest"
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            binary="$RUNNER_TEMP/attested-binaries/$target/astatine"
            test -f "$binary"
            expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["binaries"][sys.argv[2]]["sha256"])' "$manifest" "$target")"
            test -n "$expected"
            actual="$(sha256sum "$binary" | cut -d' ' -f1)"
            test "$actual" = "$expected"
            gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "refs/tags/$tag"
            test "$(sha256sum "$binary" | cut -d' ' -f1)" = "$expected"
          done
          test "$(find "$RUNNER_TEMP/attested-binaries" -mindepth 2 -maxdepth 2 -type f -name astatine | wc -l)" = "2"
          echo "packaged binaries verified against separately attested compiled binaries"
