# Build, isolated Linux unit tests, and safe-smoke checks on GitHub-hosted runners.
# This workflow does not run Anvil integration tests, publish, sign, attest,
# create releases, or read any deployment credential.
name: Rust CI

on:
  push:
    branches: [main, release/v0.1.0-testnet.5]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.94.1"

jobs:
  ruleset-bypass-visibility:
    name: Ruleset bypass actor visibility (diagnostic)
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.0-testnet.5'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report bypass_actors visibility
        shell: bash
        run: |
          set -euo pipefail
          if result="$(gh api repos/Jecta-ai/astatine-miner/rulesets/27054770 --jq 'has("bypass_actors")' 2>/dev/null)"; then
            case "$result" in
              true|false)
                printf 'ruleset bypass_actors present: %s\n' "$result"
                ;;
              *)
                printf 'ruleset bypass_actors presence: unknown (exit 0)\n'
                ;;
            esac
          else
            status=$?
            printf 'ruleset API request failed (exit %s); bypass_actors presence: unknown\n' "$status"
          fi

  native-checks:
    name: Native checks (${{ matrix.target }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            binary: astatine
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: astatine
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            binary: astatine
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            binary: astatine
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: astatine.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Assert exact pinned Rust compiler version
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.94.1"
      - name: Verify native runner architecture
        # A cross-compiled binary is not native-smoke-verified.
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '$1 == "host:" { print $2 }')"
          echo "Rust host: $host"
          test "$host" = "${{ matrix.target }}"
      - name: Reproduce CUDA PTX and validate sm_86 assembly
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/astatine-sha256d.ptx"
          support/cuda/build-ptx.sh "$generated"
          cmp src/gpu/cuda/sha256d.ptx "$generated"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked
      - name: Compile tests without executing them
        # Safe Linux test execution is in the linux-safe-tests job. Anvil,
        # native credential-store, and physical GPU tests remain opt-in.
        run: cargo test --locked --no-run
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native release build
        run: cargo build --locked --release
      - name: Build Windows password prompt smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo build --locked --release --example windows_password_prompt
      - name: Native executable smoke tests
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/${{ matrix.binary }}"
          "$binary" --version
          "$binary" --help >/dev/null
          "$binary" mine --help >/dev/null
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            file "$binary"
            ldd "$binary"
          elif [[ "${{ matrix.target }}" == *apple* ]]; then
            file "$binary"
            otool -L "$binary"
          fi
      - name: Windows hidden-password console smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $PromptExe = Join-Path $env:GITHUB_WORKSPACE 'target\release\examples\windows_password_prompt.exe'
          $Prompt = Start-Process -FilePath $PromptExe -PassThru -NoNewWindow
          if (-not $Prompt.WaitForExit(15000)) {
            $Prompt.Kill()
            throw 'Windows hidden-password console smoke timed out'
          }
          if ($Prompt.ExitCode -ne 0) { throw "Windows hidden-password console smoke failed (exit code $($Prompt.ExitCode))" }

  linux-safe-tests:
    name: Linux safe unit tests (no native keyring, Anvil, or GPU)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Run isolated safe unit tests
        shell: bash
        run: |
          set -euo pipefail
          real_home="$HOME"
          export CARGO_HOME="${CARGO_HOME:-$real_home/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$real_home/.rustup}"
          test_home="$RUNNER_TEMP/astatine-safe-test-home"
          mkdir -p "$test_home"
          export HOME="$test_home"
          export XDG_CONFIG_HOME="$test_home/.config"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/astatine-no-secret-service"
          unset ASTATINE_REQUIRE_NATIVE_CREDENTIAL_STORE
          unset ASTATINE_E2E_DEVICE
          unset ASTATINE_E2E_GPU_NODE_SET
          cargo test --locked --bin astatine -- \
            --skip config::tests::native_journal_anchor_persists_across_processes_and_is_root_scoped \
            --skip config::tests::linux_secret_service_unavailable_fails_closed_without_native_keyring
      - name: Verify isolated Linux Secret Service failure path
        shell: bash
        run: |
          set -euo pipefail
          real_home="$HOME"
          export CARGO_HOME="${CARGO_HOME:-$real_home/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$real_home/.rustup}"
          test_home="$RUNNER_TEMP/astatine-secret-service-test-home"
          mkdir -p "$test_home"
          export HOME="$test_home"
          export XDG_CONFIG_HOME="$test_home/.config"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/astatine-no-secret-service"
          cargo test --locked --bin astatine -- --exact config::tests::linux_secret_service_unavailable_fails_closed_without_native_keyring --nocapture

  windows-safe-tests:
    name: Windows safe unit tests (no native keyring, Anvil, or GPU)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Run isolated safe unit tests
        shell: bash
        run: |
          set -euo pipefail
          test_home="$RUNNER_TEMP/astatine-safe-test-home"
          mkdir -p "$test_home"
          export APPDATA="$test_home/AppData/Roaming"
          export LOCALAPPDATA="$test_home/AppData/Local"
          mkdir -p "$APPDATA" "$LOCALAPPDATA"
          isolated_temp="$test_home/temp"
          mkdir -p "$isolated_temp"
          export TEMP="$isolated_temp"
          export TMP="$isolated_temp"
          export TMPDIR="$isolated_temp"
          export HOME="$test_home"
          export XDG_CONFIG_HOME="$test_home/.config"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/definitely-unavailable-astatine-test-bus"
          unset ASTATINE_REQUIRE_NATIVE_CREDENTIAL_STORE || true
          unset ASTATINE_DISPOSABLE_CREDENTIAL_STORE || true
          unset ASTATINE_QUALIFICATION_MODE || true
          unset ASTATINE_E2E_DEVICE || true
          unset ASTATINE_E2E_GPU_NODE_SET || true
          cargo test --locked --bin astatine -- \
            --skip config::tests::native_journal_anchor_persists_across_processes_and_is_root_scoped \
            --skip config::tests::linux_secret_service_unavailable_fails_closed_without_native_keyring
      - name: Verify no private state leaked into the real profile
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$APPDATA/Astatine" ]; then
            echo "private state leaked into the real Windows profile at $APPDATA/Astatine"
            exit 1
          fi
          echo "Windows safe tests used an isolated APPDATA; real Credential Manager was not accessed"

  dependency-policy:
    name: Dependency, advisory, and license checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Require immutable full-SHA workflow action references
        run: python3 support/check_workflow_pins.py
      - name: Verify blocked fixture distribution inventory
        run: python3 -B support/verify-distribution-inventory.py
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Install pinned dependency validation tools
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-about --locked --version 0.9.2 --features cli
          cargo install cargo-audit --locked --version 0.22.2
      - name: Validate dependency policies
        run: cargo deny check
      - name: Keep inactive vulnerable optional package out of the active graph
        run: python3 support/check_dependency_policy.py --require-inactive
      - name: Audit locked dependencies
        run: cargo audit --ignore RUSTSEC-2026-0387
      - name: Regenerate third-party license notices
        run: |
          cargo about generate --locked about.hbs --output-file "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"
          cmp THIRD_PARTY_LICENSES.md "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"
