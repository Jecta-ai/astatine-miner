# Build, isolated Linux unit tests, and safe-smoke checks on GitHub-hosted runners.
# This workflow does not run Anvil integration tests, publish, sign, attest,
# create releases, or read any deployment credential.
name: Rust CI

on:
  push:
    branches: [main, release/v0.1.0-testnet.6]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.94.1"

jobs:
  ruleset-bypass-visibility:
    name: Ruleset bypass actor visibility (diagnostic)
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.0-testnet.6'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report bypass_actors visibility
        shell: bash
        run: |
          set -euo pipefail
          if result="$(gh api repos/Jecta-ai/astatine-miner/rulesets/27054770 --jq 'has("bypass_actors")' 2>/dev/null)"; then
            case "$result" in
              true|false)
                printf 'ruleset bypass_actors present: %s\n' "$result"
                ;;
              *)
                printf 'ruleset bypass_actors presence: unknown (exit 0)\n'
                ;;
            esac
          else
            status=$?
            printf 'ruleset API request failed (exit %s); bypass_actors presence: unknown\n' "$status"
          fi

  native-checks:
    name: Native checks (${{ matrix.target }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            binary: astatine
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: astatine
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            binary: astatine
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            binary: astatine
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: astatine.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Assert exact pinned Rust compiler version
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.94.1"
      - name: Verify native runner architecture
        # A cross-compiled binary is not native-smoke-verified.
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '$1 == "host:" { print $2 }')"
          echo "Rust host: $host"
          test "$host" = "${{ matrix.target }}"
      - name: Reproduce CUDA PTX and validate sm_86 assembly
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/astatine-sha256d.ptx"
          support/cuda/build-ptx.sh "$generated"
          cmp src/gpu/cuda/sha256d.ptx "$generated"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked
      - name: Compile tests without executing them
        # Safe Linux test execution is in the linux-safe-tests job. Anvil,
        # native credential-store, and physical GPU tests remain opt-in.
        run: cargo test --locked --no-run
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native release build
        run: cargo build --locked --release
      - name: Build Windows password prompt smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo build --locked --release --example windows_password_prompt
      - name: Native executable smoke tests
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/${{ matrix.binary }}"
          "$binary" --version
          "$binary" --help >/dev/null
          "$binary" mine --help >/dev/null
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            file "$binary"
            ldd "$binary"
          elif [[ "${{ matrix.target }}" == *apple* ]]; then
            file "$binary"
            otool -L "$binary"
          fi
      - name: Windows hidden-password console smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $PromptExe = Join-Path $env:GITHUB_WORKSPACE 'target\release\examples\windows_password_prompt.exe'
          $Prompt = Start-Process -FilePath $PromptExe -PassThru -NoNewWindow
          if (-not $Prompt.WaitForExit(15000)) {
            $Prompt.Kill()
            throw 'Windows hidden-password console smoke timed out'
          }
          if ($Prompt.ExitCode -ne 0) { throw "Windows hidden-password console smoke failed (exit code $($Prompt.ExitCode))" }

  linux-safe-tests:
    name: Linux safe unit tests (no native keyring, Anvil, or GPU)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Run isolated safe unit tests
        shell: bash
        run: |
          set -euo pipefail
          real_home="$HOME"
          export CARGO_HOME="${CARGO_HOME:-$real_home/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$real_home/.rustup}"
          test_home="$RUNNER_TEMP/astatine-safe-test-home"
          mkdir -p "$test_home"
          export HOME="$test_home"
          export XDG_CONFIG_HOME="$test_home/.config"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/astatine-no-secret-service"
          unset ASTATINE_REQUIRE_NATIVE_CREDENTIAL_STORE
          unset ASTATINE_E2E_DEVICE
          unset ASTATINE_E2E_GPU_NODE_SET
          cargo test --locked --bin astatine -- \
            --skip config::tests::native_journal_anchor_persists_across_processes_and_is_root_scoped \
            --skip config::tests::linux_secret_service_unavailable_fails_closed_without_native_keyring
      - name: Verify isolated Linux Secret Service failure path
        shell: bash
        run: |
          set -euo pipefail
          real_home="$HOME"
          export CARGO_HOME="${CARGO_HOME:-$real_home/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$real_home/.rustup}"
          test_home="$RUNNER_TEMP/astatine-secret-service-test-home"
          mkdir -p "$test_home"
          export HOME="$test_home"
          export XDG_CONFIG_HOME="$test_home/.config"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/astatine-no-secret-service"
          cargo test --locked --bin astatine -- --exact config::tests::linux_secret_service_unavailable_fails_closed_without_native_keyring --nocapture

  windows-safe-tests:
    name: Windows safe unit tests (no native keyring, Anvil, or GPU)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Run isolated safe unit tests
        shell: bash
        run: |
          set -euo pipefail
          test_home="$RUNNER_TEMP/astatine-safe-test-home"
          mkdir -p "$test_home"
          export APPDATA="$test_home/AppData/Roaming"
          export LOCALAPPDATA="$test_home/AppData/Local"
          mkdir -p "$APPDATA" "$LOCALAPPDATA"
          isolated_temp="$test_home/temp"
          mkdir -p "$isolated_temp"
          export TEMP="$isolated_temp"
          export TMP="$isolated_temp"
          export TMPDIR="$isolated_temp"
          export HOME="$test_home"
          export XDG_CONFIG_HOME="$test_home/.config"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/definitely-unavailable-astatine-test-bus"
          unset ASTATINE_REQUIRE_NATIVE_CREDENTIAL_STORE || true
          unset ASTATINE_DISPOSABLE_CREDENTIAL_STORE || true
          unset ASTATINE_QUALIFICATION_MODE || true
          unset ASTATINE_E2E_DEVICE || true
          unset ASTATINE_E2E_GPU_NODE_SET || true
          cargo test --locked --bin astatine -- \
            --skip config::tests::native_journal_anchor_persists_across_processes_and_is_root_scoped \
            --skip config::tests::linux_secret_service_unavailable_fails_closed_without_native_keyring
      - name: Verify no private state leaked into the real profile
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$APPDATA/Astatine" ]; then
            echo "private state leaked into the real Windows profile at $APPDATA/Astatine"
            exit 1
          fi
          echo "Windows safe tests used an isolated APPDATA; real Credential Manager was not accessed"

  windows-archive-validation:
    name: Windows archive validation (release script verbatim, native)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Build fixtures and extract exact release script verbatim
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.1.0-testnet.6'
          $fixtures = Join-Path $env:RUNNER_TEMP 'win-archive-fixtures'
          if (Test-Path -LiteralPath $fixtures) { Remove-Item -LiteralPath $fixtures -Recurse -Force }
          New-Item -ItemType Directory -Path $fixtures | Out-Null
          $genPy = Join-Path $env:RUNNER_TEMP 'make-win-fixtures.py'
          if (Test-Path -LiteralPath $genPy) { Remove-Item -LiteralPath $genPy -Force }
          $genCode = @'
          import pathlib
          import sys
          import zipfile
          out = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          root = f"astatine-{tag}-windows-x86_64"
          members = {
              f"{root}/astatine.exe": b"fake-pe-binary-for-validation-only",
              f"{root}/LICENSE-MIT": b"MIT license placeholder\n",
              f"{root}/THIRD_PARTY_LICENSES.md": b"# Third party notices placeholder\n",
              f"{root}/BUILD-INFO.json": b'{"synthetic": true}\n',
              f"{root}/INSTALL.md": b"# Install placeholder\n",
          }
          def write_zip(path, member_dict):
              items = sorted(member_dict.items())
              with zipfile.ZipFile(path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for name, data in items:
                      info = zipfile.ZipInfo(filename=name)
                      info.date_time = (1980, 1, 1, 0, 0, 0)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.create_system = 3
                      mode = 0o755 if name.endswith("astatine.exe") else 0o644
                      info.external_attr = (mode & 0xFFFF) << 16
                      zf.writestr(info, data)
          write_zip(out / "positive.zip", members)
          missing = {k: v for k, v in members.items() if not k.endswith("INSTALL.md")}
          write_zip(out / "neg-missing.zip", missing)
          extra = dict(members)
          extra[f"{root}/evil.exe"] = b"unexpected"
          write_zip(out / "neg-extra.zip", extra)
          doubleslash = {}
          for k, v in members.items():
              if k.endswith("astatine.exe"):
                  doubleslash[k.replace(f"{root}/", f"{root}//", 1)] = v
              else:
                  doubleslash[k] = v
          write_zip(out / "neg-doubleslash.zip", doubleslash)
          backslash = dict(members)
          backslash[f"{root}\\evil.exe"] = b"unexpected"
          write_zip(out / "neg-backslash.zip", backslash)
          traversal = dict(members)
          traversal[f"{root}/../evil.exe"] = b"unexpected"
          write_zip(out / "neg-traversal.zip", traversal)
          absolute = dict(members)
          absolute["/absolute-evil.exe"] = b"unexpected"
          write_zip(out / "neg-absolute.zip", absolute)
          print("synthetic ZIPs created")
          '@
          Set-Content -LiteralPath $genPy -Value $genCode -Encoding utf8
          $pyCmd = $null
          foreach ($candidate in @('python3', 'python', 'py')) {
            $found = Get-Command $candidate -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $pyCmd = $found.Source; break }
          }
          if (-not $pyCmd) { throw 'no Python interpreter found (python3/python/py)' }
          if ($pyCmd -like '*py.exe') {
            & $pyCmd -3 -B $genPy $fixtures $tag
          } else {
            & $pyCmd -B $genPy $fixtures $tag
          }
          if ($LASTEXITCODE -ne 0) { throw "fixture generation failed ($LASTEXITCODE)" }
          Get-ChildItem -LiteralPath $fixtures | ForEach-Object { Write-Host $_.FullName }
          $extracted = Join-Path $env:RUNNER_TEMP 'extracted-smoke.ps1'
          if (Test-Path -LiteralPath $extracted) { Remove-Item -LiteralPath $extracted -Force }
          $helper = Join-Path $env:GITHUB_WORKSPACE 'support/release/extract-windows-smoke.py'
          if (-not (Test-Path -LiteralPath $helper)) { throw "extractor missing: $helper" }
          if ($pyCmd -like '*py.exe') {
            & $pyCmd -3 -B $helper --workflow .github/workflows/release.yml --out $extracted
          } else {
            & $pyCmd -B $helper --workflow .github/workflows/release.yml --out $extracted
          }
          if ($LASTEXITCODE -ne 0) { throw "extraction failed ($LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath $extracted)) { throw "extracted script missing after extraction" }
          $content = Get-Content -LiteralPath $extracted -Raw
          if ($content -notmatch [regex]::Escape('$root = "astatine-$env:RELEASE_TAG-windows-x86_64"')) { throw 'extracted script missing fixed root' }
          if ($content -match 'windows-x86_64/"') { throw 'trailing slash in extracted script' }
      - name: Validate positive synthetic archive with exact release script (no execution)
        shell: pwsh
        env:
          RELEASE_TAG: v0.1.0-testnet.6
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $fixtures = Join-Path $env:RUNNER_TEMP 'win-archive-fixtures'
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'bundle'
          if (Test-Path -LiteralPath $bundleDir) { Remove-Item -LiteralPath $bundleDir -Recurse -Force }
          New-Item -ItemType Directory -Path $bundleDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $fixtures 'positive.zip') -Destination (Join-Path $bundleDir "astatine-$tag-windows-x86_64.zip")
          $extracted = Join-Path $env:RUNNER_TEMP 'extracted-smoke.ps1'
          if (-not (Test-Path -LiteralPath $extracted)) { throw "extracted script missing: $extracted" }
          & $extracted
          if ($LASTEXITCODE -ne 0) { throw "exact release script failed on positive ($LASTEXITCODE)" }
          $sandbox = Join-Path $env:RUNNER_TEMP 'win-archive-smoke'
          $rootDir = Join-Path $sandbox "astatine-$tag-windows-x86_64"
          $exe = Join-Path $rootDir 'astatine.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'positive extracted executable missing' }
          Write-Host 'Positive synthetic archive validated with exact release script (no execution)'
      - name: Reject invalid synthetic archives with exact release script (no execution)
        shell: pwsh
        env:
          RELEASE_TAG: v0.1.0-testnet.6
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $fixtures = Join-Path $env:RUNNER_TEMP 'win-archive-fixtures'
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'bundle'
          $extracted = Join-Path $env:RUNNER_TEMP 'extracted-smoke.ps1'
          $negCases = @('neg-missing.zip', 'neg-extra.zip', 'neg-doubleslash.zip', 'neg-backslash.zip', 'neg-traversal.zip', 'neg-absolute.zip')
          foreach ($case in $negCases) {
            if (Test-Path -LiteralPath $bundleDir) { Remove-Item -LiteralPath $bundleDir -Recurse -Force }
            New-Item -ItemType Directory -Path $bundleDir | Out-Null
            Copy-Item -LiteralPath (Join-Path $fixtures $case) -Destination (Join-Path $bundleDir "astatine-$tag-windows-x86_64.zip")
            try {
              & $extracted
              throw "negative case unexpectedly passed: $case"
            } catch {
              if ($_.Exception.Message -like 'negative case unexpectedly passed*') { throw }
              Write-Host "Negative case correctly rejected: $case ($($_.Exception.Message))"
            }
          }
          Write-Host 'Invalid synthetic archives rejected with exact release script (no execution)'

  dependency-policy:
    name: Dependency, advisory, and license checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Require immutable full-SHA workflow action references
        run: python3 support/check_workflow_pins.py
      - name: Verify blocked fixture distribution inventory
        run: python3 -B support/verify-distribution-inventory.py
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Install pinned dependency validation tools
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-about --locked --version 0.9.2 --features cli
          cargo install cargo-audit --locked --version 0.22.2
      - name: Validate dependency policies
        run: cargo deny check
      - name: Keep inactive vulnerable optional package out of the active graph
        run: python3 support/check_dependency_policy.py --require-inactive
      - name: Audit locked dependencies
        run: cargo audit --ignore RUSTSEC-2026-0387
      - name: Regenerate third-party license notices
        run: |
          cargo about generate --locked about.hbs --output-file "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"
          cmp THIRD_PARTY_LICENSES.md "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"
